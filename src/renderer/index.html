<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spendly</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="dark">
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 16.5 9 11l3.6 3.6L20 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M15 7h5v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">Spendly</span>
            <span class="brand-sub">Expense tracker</span>
          </div>
        </div>

        <nav class="nav" id="nav">
          <button class="nav-item" data-view="dashboard">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6V11h-6v9Zm0-16v4h6V4h-6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            <span>Dashboard</span>
          </button>
          <button class="nav-item" data-view="transactions">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h13l-3-3m3 3-3 3M20 17H7l3-3m-3 3 3 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Transactions</span>
          </button>
          <button class="nav-item" data-view="budgets">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span>Budgets</span>
          </button>
          <button class="nav-item" data-view="reports">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20V10m5 10V4m5 16v-7m5 7V8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
            <span>Reports</span>
          </button>
          <button class="nav-item" data-view="categories">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5h7l9 9-6 6-9-9V5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="8.5" cy="9.5" r="1.4" fill="currentColor"/></svg>
            <span>Categories</span>
          </button>

          <div class="nav-divider"></div>

          <button class="nav-item" data-view="settings">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.11a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.11A1.7 1.7 0 0 0 4.6 8.94a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.11a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.19.62.72 1 1.56 1.03H21a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.49.97Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            <span>Settings</span>
          </button>
        </nav>

        <div class="sidebar-foot">
          <div class="balance-card">
            <span class="balance-label">Available balance</span>
            <strong class="balance-value" id="sidebar-balance">৳0.00</strong>
            <span class="balance-hint" id="sidebar-hint">No transactions yet</span>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-title">
            <h1 id="page-title">Dashboard</h1>
            <p id="page-subtitle">Your financial overview</p>
          </div>
          <div class="topbar-actions">
            <span class="today" id="today"></span>
            <button class="btn primary" id="add-transaction">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
              Add transaction
            </button>
          </div>
        </header>

        <section class="view" id="view"></section>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>

    <script src="../../node_modules/chart.js/dist/chart.umd.js"></script>
    <script src="js/util.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/transactions.js"></script>
    <script src="js/budgets.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/boot.js"></script>
  </body>
</html>
